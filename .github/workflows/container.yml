# Lab-only build: tag `lab-vX.Y.Z` -> self-hosted ARC runner -> remote rootless buildkitd -> Zot.
# (NOT for upstream — this is robgil/infra lab CI. The image is consumed by flux/apps/rkllama.)
name: container

on:
  push:
    tags:
      - 'lab-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (e.g. lab-v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: rk-llama-arc          # matches the gha-runner-scale-set runnerScaleSetName
    env:
      REGISTRY: registry.internal
      IMAGE: rk-llama-server
      BUILDKIT_ADDR: tcp://buildkitd.arc-runners.svc:1234
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Zot push credentials (the `ci` htpasswd user). Secret is a full docker config.json,
      # created out-of-band from `pass lab/zot/ci`. buildctl reads it for registry auth.
      - name: Configure registry auth
        run: |
          install -d -m 700 "$HOME/.docker"
          printf '%s' '${{ secrets.ZOT_DOCKERCONFIG }}' > "$HOME/.docker/config.json"

      - name: Build and push (buildctl -> buildkitd -> Zot)
        run: |
          buildctl --addr "$BUILDKIT_ADDR" build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=.devops \
            --opt filename=rknpu2.Dockerfile \
            --output type=image,name=${REGISTRY}/${IMAGE}:${{ steps.tag.outputs.tag }},push=true

      - name: Done
        run: echo "pushed ${REGISTRY}/${IMAGE}:${{ steps.tag.outputs.tag }}"
